app = "archie-chatbot"
primary_region = "ams"

[mounts]
  source = "archie_data"
  destination = "/data"

[http_service]
  internal_port = 4008
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
